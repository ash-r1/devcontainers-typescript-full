name: devcontainer

on:
  push:
    branches: [main]
  pull_request:
  # ベースイメージは :latest 追従なので、変更がなくても定期的に壊れていないか確認する
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build & smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, full]
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.target }} image
        run: docker build --target "${{ matrix.target }}" -t "devcontainer-smoke:${{ matrix.target }}" .devcontainer

      # root（entrypoint 実行ユーザー）と node（実作業ユーザー）の両方で確認する
      - name: Smoke test as root
        run: |
          docker run --rm \
            -e SMOKE_TARGET="${{ matrix.target }}" \
            -v "$PWD/.devcontainer/scripts:/smoke:ro" \
            --entrypoint bash \
            "devcontainer-smoke:${{ matrix.target }}" /smoke/smoke-test.sh

      - name: Smoke test as node
        run: |
          docker run --rm --user node -e HOME=/home/node \
            -e SMOKE_TARGET="${{ matrix.target }}" \
            -v "$PWD/.devcontainer/scripts:/smoke:ro" \
            --entrypoint bash \
            "devcontainer-smoke:${{ matrix.target }}" /smoke/smoke-test.sh

  config:
    name: config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # config.toml は gitignore されているのでテンプレートから作る
      - name: Create config.toml from template
        run: cp .devcontainer/example.config.toml .devcontainer/config.toml

      - name: Validate docker-compose.yml
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet

      - name: Validate devcontainer.json
        run: npx -y @devcontainers/cli read-configuration --workspace-folder . > /dev/null
