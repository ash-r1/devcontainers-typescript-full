services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: full  # Change to "base" if you don't need ffmpeg/imagemagick
    volumes:
      - ..:/workspace:cached
      - ./config.toml:/workspace/.devcontainer/config.toml:ro
      - ../.devcontainer-data/npm-global:/home/node/.npm-global
      - ../.devcontainer-data/codex:/home/node/.codex
      - ../.devcontainer-data/claude:/home/node/.claude
      - ../.devcontainer-data/claude-root:/home/node/.claude-root
      - ../.devcontainer-data/gh:/home/node/.config/gh
      - ../.devcontainer-data/aws:/home/node/.aws
      # Shared socket volumes for DB connections (no TCP ports needed)
      - mysql-socket:/var/run/mysqld
      - postgresql-socket:/var/run/postgresql

  # ── Optional: MySQL sidecar (uncomment to use) ──────────
  # mysql:
  #   image: mysql:8
  #   volumes:
  #     - mysql-socket:/var/run/mysqld
  #     - mysql-data:/var/lib/mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: devpassword
  #   command: --socket=/var/run/mysqld/mysqld.sock

  # ── Optional: PostgreSQL sidecar (uncomment to use) ─────
  # postgres:
  #   image: postgres:16
  #   volumes:
  #     - postgresql-socket:/var/run/postgresql
  #     - postgres-data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_PASSWORD: devpassword

volumes:
  mysql-socket:
  postgresql-socket:
  # mysql-data:
  # postgres-data:
