# devcontainer configuration
# Copy this file to .devcontainer.config.toml in your project root.
# IMPORTANT: Add .devcontainer.config.toml to your .gitignore (contains secrets).

# ── Required ─────────────────────────────────────────────
[git]
name = "Your Name"
email = "your.email@example.com"

# ── Claude Code ──────────────────────────────────────────
# [claude]
# api_key = "sk-ant-..."

# ── OpenAI Codex CLI ─────────────────────────────────────
# [codex]
# api_key = "sk-..."

# ── GitHub CLI ───────────────────────────────────────────
# [github]
# token = "ghp_..."

# ── AWS CLI ──────────────────────────────────────────────
# [aws]
# access_key_id = "AKIA..."
# secret_access_key = "..."
# region = "ap-northeast-1"

# ── Database sockets (for Unix socket connections) ───────
# These are set automatically when using docker-compose sidecars.
# Override only if you have a custom socket path.
# [mysql]
# socket = "/var/run/mysqld/mysqld.sock"
#
# [postgresql]
# socket = "/var/run/postgresql"

# ── Custom hooks ─────────────────────────────────────────
# [hooks]
# post_start = "./scripts/my-setup.sh"
